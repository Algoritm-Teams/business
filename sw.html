<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>Пульт управления — ручки.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --fg:#f4f0e6; --muted:#8e8b85; --line:#222225;
    --accent:#facc15; --card-bg:rgba(255,255,255,.02); --input-bg:#121214;
    --danger:#ff4a1c; --success:#22c55e; --sans:'Inter',sans-serif; --serif:'Instrument Serif',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body { background:var(--bg); color:var(--fg); font-family:var(--sans); line-height:1.6; min-height: 100vh; overflow-x: hidden; }
  a{color:inherit;text-decoration:none}
  button,input,textarea{font:inherit}
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ЭКРАН ВХОДА */
  #loginScreen{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center;}
  .login-box { background: var(--card-bg); border: 1px solid var(--line); padding: 3rem 2rem; border-radius: 24px; text-align: center; width: min(100%, 400px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .logo-mark { font-family: var(--serif); font-style: italic; font-size: 2.5rem; color: var(--accent); margin-bottom: 0.5rem; line-height: 1; }
  #loginScreen h1 { font-size: 1.2rem; font-weight: 500; margin-bottom: 2rem; }
  #loginScreen input { width:100%; height:52px; background:var(--input-bg); border:1px solid var(--line); border-radius:12px; color:var(--fg); padding:0 1rem; font-size:1rem; outline:none; text-align:center; margin-bottom: 1rem; transition: border-color 0.3s; }
  #loginScreen input:focus { border-color: var(--accent); }
  #loginScreen button { width:100%; height:52px; background:var(--accent); color:var(--bg); border:none; border-radius:12px; font-weight:600; font-size:1rem; cursor:pointer; transition: 0.2s; }
  #loginScreen button:hover { background: #eab308; transform: translateY(-1px); }
  #loginScreen button:disabled { opacity: 0.7; cursor: wait; }
  #loginError { color:var(--danger); font-size:.85rem; display:none; margin-top: 0.5rem; }

  /* ПАНЕЛЬ */
  #adminPanel { display: none; max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .header { display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 1rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem; margin-bottom:2rem; }
  .header h1 { font-size:1.5rem; font-weight: 500; }
  .header .right-side { display: flex; gap: 1rem; align-items: center; }
  .header a, .header button { font-size:.8rem; color:var(--muted); background: transparent; border: 1px solid var(--line); padding: 0.5rem 1rem; border-radius: 100px; cursor: pointer; transition: 0.2s; }
  .header a:hover, .header button:hover { border-color: var(--fg); color: var(--fg); }
  
  /* ВКЛАДКИ */
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; background: var(--card-bg); padding: 0.5rem; border-radius: 12px; width: fit-content; border: 1px solid var(--line); }
  .tab { padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: var(--muted); transition: 0.2s; font-weight: 500; }
  .tab.active { background: var(--fg); color: var(--bg); }
  .content-section { display: none; animation: slideUp 0.4s ease; }
  .content-section.active { display: block; }

  /* АНАЛИТИКА */
  .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 16px; padding: 1.5rem; }
  .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.5rem; }
  .stat-value { font-size: 2.5rem; font-weight: 600; line-height: 1; }
  .stat-value span { font-size: 1rem; color: var(--muted); font-weight: 400; }
  .rating-bars { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
  .bar-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
  .bar-track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }

  /* СПИСОК */
  .search-bar { width: 100%; height: 48px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 12px; padding: 0 1rem; color: var(--fg); margin-bottom: 1.5rem; outline: none; }
  .search-bar:focus { border-color: var(--accent); }
  .review-item { background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px; padding: 1.8rem; margin-bottom: 1rem; transition: border-color 0.3s; }
  .review-item:hover { border-color: rgba(250,204,21,0.2); }
  .review-top { display:flex; justify-content:space-between; margin-bottom:.5rem; gap: 1rem; }
  .review-author { font-weight:600; font-size:1.1rem; }
  .review-date { font-size:.8rem; color:var(--muted); }
  .review-stars { color:var(--accent); margin-bottom:.8rem; }
  .review-text { font-size:.95rem; color:#d1d0c9; margin-bottom:1.2rem; white-space:pre-wrap; }
  .admin-reply { background: linear-gradient(90deg, rgba(250,204,21,0.08) 0%, rgba(250,204,21,0.02) 100%); border-left:3px solid var(--accent); padding:1rem; border-radius:0 12px 12px 0; margin-bottom:1.5rem; font-size:.9rem; }
  .admin-reply strong { color:var(--accent); display:block; margin-bottom:.3rem; font-size: 0.75rem; text-transform: uppercase; }
  .actions { display:flex; gap:.6rem; flex-wrap:wrap; }
  .btn { padding:.5rem 1rem; border-radius:8px; font-size:.8rem; font-weight:500; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--fg); transition:.2s; }
  .btn-reply { color:var(--accent); border-color:rgba(250,204,21,0.3); }
  .btn-reply:hover { background:rgba(250,204,21,0.08); }
  .btn-delete { color:var(--danger); border-color:rgba(255,74,28,0.3); }
  .btn-delete:hover { background:rgba(255,74,28,0.08); }
  .reply-form { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--line); }
  .reply-form textarea { width:100%; height:80px; background:var(--input-bg); border:1px solid var(--line); border-radius:12px; padding:1rem; color:var(--fg); margin-bottom:.8rem; outline: none; resize: vertical; }
  .reply-form textarea:focus { border-color: var(--accent); }
  .reply-form .save-btn { background:var(--accent); color:var(--bg); border:none; padding:.5rem 1rem; border-radius:8px; font-weight:600; cursor:pointer; }
  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 20px; }

  @keyframes slideUp { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
  @media(max-width: 820px) {
    .analytics-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ВХОД -->
<div id="loginScreen">
  <div class="login-box">
    <div class="logo-mark">ручки.</div>
    <h1>Секретная панель</h1>
    <input type="password" id="passwordInput" placeholder="Введи код доступа" />
    <button id="loginBtn" onclick="checkPassword()">Войти в систему</button>
    <p id="loginError">Неверный код доступа</p>
  </div>
</div>

<!-- ПАНЕЛЬ -->
<div id="adminPanel">
  <div class="header">
    <h1>Пульт управления</h1>
    <div class="right-side">
      <a href="index.html">← На главную</a>
      <button onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('reviews')">Отзывы</div>
    <div class="tab" onclick="switchTab('analytics')">Аналитика</div>
  </div>

  <div id="tab-reviews" class="content-section active">
    <input type="text" id="searchInput" class="search-bar" placeholder="Поиск..." oninput="filterReviews()">
    <div id="reviewsList"></div>
  </div>

  <div id="tab-analytics" class="content-section">
    <div class="analytics-grid">
      <div class="stat-card"><div class="stat-label">Всего отзывов</div><div class="stat-value" id="statTotal">0</div></div>
      <div class="stat-card"><div class="stat-label">Средняя оценка</div><div class="stat-value" id="statAverage">0.0 <span>/ 5</span></div></div>
      <div class="stat-card"><div class="stat-label">Хорошие (4-5)</div><div class="stat-value" id="statGood">0%</div></div>
    </div>
    <div class="stat-card"><div class="stat-label">Распределение оценок</div><div class="rating-bars" id="ratingBars"></div></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://qevwufuurayndnulmpvd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_3DqBGv-sI6tcsf_xSgxksg_Cjv9G6Db";
  const TABLE_URL = () => SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/reviews";
  const RPC_URL = () => SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/check_admin_password";
  
  let currentReviews = [];
  let searchQuery = "";
  const headers = extra => ({ apikey: SUPABASE_ANON_KEY, ...extra });

  /* ---------- АВТОРИЗАЦИЯ (ЧЕРЕЗ БАЗУ) ---------- */
  async function checkPassword() {
    const pass = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    const error = document.getElementById('loginError');

    if (!pass) return;

    btn.disabled = true;
    btn.textContent = "Проверка...";
    error.style.display = 'none';

    try {
      // Стучимся в базу с вопросом "Пароль верный?"
      const res = await fetch(RPC_URL(), {
        method: 'POST',
        headers: headers({"Content-Type": "application/json"}),
        body: JSON.stringify({ input_pass: pass })
      });

      if (!res.ok) throw new Error("Ошибка сервера");

      const isCorrect = await res.json(); // Вернет true или false

      if (isCorrect) {
        // Если true — пускаем
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAllReviews();
      } else {
        // Если false — ошибка
        error.style.display = 'block';
        document.getElementById('passwordInput').value = '';
      }
    } catch (e) {
      error.textContent = "Ошибка сети. Попробуй позже.";
      error.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = "Войти в систему";
    }
  }

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }
  document.getElementById('passwordInput').addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });

  /* ---------- ВКЛАДКИ ---------- */
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    if (tab === 'reviews') {
      document.querySelector('.tab:nth-child(1)').classList.add('active');
      document.getElementById('tab-reviews').classList.add('active');
    } else {
      document.querySelector('.tab:nth-child(2)').classList.add('active');
      document.getElementById('tab-analytics').classList.add('active');
      renderAnalytics();
    }
  }

  /* ---------- ЗАГРУЗКА ДАННЫХ ---------- */
  async function loadAllReviews() {
    const list = document.getElementById('reviewsList');
    list.innerHTML = '<div class="empty-state">Загрузка...</div>';
    try {
      const res = await fetch(TABLE_URL() + "?select=*&order=created_at.desc", { headers: headers({"Accept": "application/json"}) });
      currentReviews = await res.json();
      renderReviewsList();
      renderAnalytics();
    } catch (e) {
      list.innerHTML = '<div class="empty-state" style="color:#ff4a1c">Ошибка загрузки</div>';
    }
  }

  function filterReviews() {
    searchQuery = document.getElementById('searchInput').value.toLowerCase();
    renderReviewsList();
  }

  function renderReviewsList() {
    const list = document.getElementById('reviewsList');
    const filtered = currentReviews.filter(item => item.name.toLowerCase().includes(searchQuery) || item.message.toLowerCase().includes(searchQuery));
    if (!filtered.length) { list.innerHTML = '<div class="empty-state">Ничего не найдено.</div>'; return; }
    list.innerHTML = filtered.map(item => `
      <div class="review-item" id="review-${item.id}">
        <div class="review-top"><div class="review-author">${item.name}</div><div class="review-date">${new Date(item.created_at).toLocaleDateString('ru-RU')}</div></div>
        <div class="review-stars">${"★".repeat(item.rating)}${"☆".repeat(5-item.rating)}</div>
        <div class="review-text">${item.message}</div>
        ${item.admin_reply ? `<div class="admin-reply"><strong>Ответ магазина</strong>${item.admin_reply}</div>` : ''}
        <div class="actions">
          <button class="btn btn-reply" onclick="toggleReplyForm(${item.id})">${item.admin_reply ? 'Изменить ответ' : 'Ответить'}</button>
          <button class="btn btn-delete" onclick="deleteReview(${item.id})">Удалить</button>
        </div>
        <div class="reply-form" id="reply-form-${item.id}">
          <textarea id="reply-text-${item.id}" placeholder="Твой ответ...">${item.admin_reply || ''}</textarea>
          <button class="save-btn" onclick="saveReply(${item.id})">Сохранить</button>
        </div>
      </div>
    `).join('');
  }

  /* ---------- АНАЛИТИКА ---------- */
  function renderAnalytics() {
    const total = currentReviews.length;
    if (!total) return;
    const sum = currentReviews.reduce((acc, r) => acc + r.rating, 0);
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAverage').innerHTML = `${(sum/total).toFixed(1)} <span>/ 5</span>`;
    document.getElementById('statGood').textContent = Math.round((currentReviews.filter(r => r.rating >= 4).length / total) * 100) + '%';
    
    const counts = [0, 0, 0, 0, 0];
    currentReviews.forEach(r => counts[r.rating - 1]++);
    let html = '';
    for (let i = 4; i >= 0; i--) {
      const percent = Math.round((counts[i] / total) * 100);
      html += `<div class="bar-row"><span>${i + 1} ★</span><div class="bar-track"><div class="bar-fill" style="width: ${percent}%"></div></div><span style="width: 30px; text-align: right;">${counts[i]}</span></div>`;
    }
    document.getElementById('ratingBars').innerHTML = html;
  }

  /* ---------- ДЕЙСТВИЯ ---------- */
  function toggleReplyForm(id) {
    const form = document.getElementById(`reply-form-${id}`);
    form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  async function saveReply(id) {
    const text = document.getElementById(`reply-text-${id}`).value.trim();
    const btn = document.querySelector(`#reply-form-${id} .save-btn`);
    btn.textContent = 'Сохранение...'; btn.disabled = true;
    try {
      const res = await fetch(TABLE_URL() + `?id=eq.${id}`, {
        method: 'PATCH', headers: headers({"Content-Type": "application/json"}), body: JSON.stringify({ admin_reply: text })
      });
      if (res.ok) {
        const idx = currentReviews.findIndex(r => r.id === id);
        if (idx !== -1) currentReviews[idx].admin_reply = text;
        renderReviewsList(); 
      }
    } catch (e) { alert("Ошибка"); } finally { btn.textContent = 'Сохранить'; btn.disabled = false; }
  }

  async function deleteReview(id) {
    if (!confirm("Удалить отзыв?")) return;
    try {
      const res = await fetch(TABLE_URL() + `?id=eq.${id}`, { method: 'DELETE', headers: headers() });
      if (res.ok) {
        const el = document.getElementById(`review-${id}`);
        el.style.opacity = '0';
        setTimeout(() => { currentReviews = currentReviews.filter(r => r.id !== id); renderReviewsList(); renderAnalytics(); }, 200);
      }
    } catch (e) { alert("Ошибка"); }
  }
</script>
</body>
</html>
